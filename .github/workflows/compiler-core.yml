name: Compiler Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "compiler/**"
      - ".github/workflows/compiler-core.yml"
  pull_request:
    paths:
      - "compiler/**"
      - ".github/workflows/compiler-core.yml"

permissions:
  contents: read

jobs:
  build-and-smoke-test-linux:
    name: Linux Compiler Core & Smoke Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ rustc cargo sbcl cl-cffi clojure libjna-java flex bison nlohmann-json3-dev libssl-dev
          python3 -m pip install --disable-pip-version-check -r compiler/tests/requirements-openqasm3.txt

      - name: Restore Mercury C-backend toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/synq-mercury
          key: mercury-22.01.8-${{ runner.os }}-${{ runner.arch }}

      - name: Build verified Mercury C-backend toolchain
        run: |
          mercury_bin="$(compiler/tests/interop/setup_mercury_toolchain.sh | tail -n 1)"
          echo "$mercury_bin" >> "$GITHUB_PATH"

      - name: Configure verified recovery profile
        run: |
          cmake -S compiler -B compiler/build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI_TOOLS=OFF \
            -DBUILD_COMPILER_EXECUTABLE=OFF \
            -DBUILD_EXPERIMENTAL_COMPONENTS=OFF \
            -DBUILD_REPL=OFF \
            -DBUILD_CORE_SMOKE_TESTS=ON

      - name: Build compiler core
        run: cmake --build compiler/build --parallel 2

      - name: Run compiler-core smoke test
        run: ctest --test-dir compiler/build --output-on-failure

      - name: Archive Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synq-compiler-linux-artifact
          path: |
            compiler/build/libsynq_lib.a
            compiler/build/synqc*
            compiler/build/libsynq_ffi*

  build-and-smoke-test-windows:
    name: Windows Compiler Core & Smoke Test (MSVC)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v4
        with:
          cmake-version: '3.28.x'

      - name: Install nlohmann_json via vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonPath: ''
          vcpkgArguments: 'nlohmann-json'

      - name: Configure verified recovery profile (Windows)
        run: |
          cmake -S compiler -B compiler/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DBUILD_TESTS=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI_TOOLS=OFF \
            -DBUILD_COMPILER_EXECUTABLE=OFF \
            -DBUILD_EXPERIMENTAL_COMPONENTS=OFF \
            -DBUILD_REPL=OFF \
            -DBUILD_CORE_SMOKE_TESTS=ON

      - name: Build compiler core (Windows)
        run: cmake --build compiler/build --config Release --parallel 2

      - name: Run compiler-core smoke test (Windows)
        run: ctest --test-dir compiler/build --config Release --output-on-failure

      - name: Archive Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synq-compiler-windows-artifact
          path: |
            compiler/build/Release/synq_lib.lib
            compiler/build/Release/synqc.exe
            compiler/build/Release/synq_ffi.dll

  clean-install-sdk-ubuntu-22:
    name: Clean-install static SDK conformance (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install minimal native SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ nlohmann-json3-dev libssl-dev

      - name: Configure clean native SDK producer
        run: |
          cmake -S compiler -B compiler/clean-sdk-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CLI_TOOLS=OFF \
            -DBUILD_COMPILER_EXECUTABLE=OFF \
            -DBUILD_EXPERIMENTAL_COMPONENTS=OFF \
            -DBUILD_REPL=OFF \
            -DBUILD_CORE_SMOKE_TESTS=OFF \
            -DBUILD_RECOVERY_CLI=OFF \
            -DBUILD_RECOVERY_NATIVE_SDK=ON

      - name: Build and install static SDK into an isolated prefix
        run: |
          cmake --build compiler/clean-sdk-build --parallel 2
          cmake --install compiler/clean-sdk-build --prefix "$RUNNER_TEMP/synq-sdk-prefix"

      - name: Configure and build external C ABI consumer
        run: |
          cmake -S compiler/tests/interop/installed_sdk_consumer -B "$RUNNER_TEMP/synq-sdk-consumer" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/synq-sdk-prefix"
          cmake --build "$RUNNER_TEMP/synq-sdk-consumer" --parallel 2

      - name: Run external clean-install consumer
        run: "$RUNNER_TEMP/synq-sdk-consumer/synq_installed_sdk_consumer"
